name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      matrix:
        config:
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, lib_name: bacy.dll }
          - { name: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, lib_name: bacy.dll }
          - { name: macos-x86_64, os: macos-15, target: x86_64-apple-darwin, lib_name: libbacy.dylib }
          - { name: macos-aarch64, os: macos-15, target: aarch64-apple-darwin, lib_name: libbacy.dylib }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, lib_name: libbacy.so }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib_name: libbacy.so }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.config.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build FFI library
        run: cargo build --release --locked -p bacy-ffi --target ${{ matrix.config.target }}

      - name: Check generated headers
        shell: bash
        run: |
          git diff --exit-code -- ffi/bacy/bindings
          test -z "$(git ls-files --others --exclude-standard -- ffi/bacy/bindings)"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p publish/include
          cp target/${{ matrix.config.target }}/release/${{ matrix.config.lib_name }} publish/
          cp ffi/bacy/bindings/*.h publish/include/

      - name: Upload FFI artifact
        uses: actions/upload-artifact@v7
        with:
          name: bacy-${{ matrix.config.name }}-sdk
          path: publish
